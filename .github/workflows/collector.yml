name: collector
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"  # UTC → 18:17, 00:17, 06:17, 12:17 CDMX (UTC-6 fijo). Minuto 17 porque GitHub retrasa o salta los crons en minuto 0. La de 06:17 UTC es la consolidación de medianoche CDMX
  workflow_dispatch:
    inputs:
      accounts: { description: "IDs de cuenta separados por coma (vacío = todas)", required: false, default: "" }
      days: { description: "Días de backfill si la cuenta está vacía", required: false, default: "90" }
      weekly: { description: "Reporte semanal: auto (lunes), force, off", required: false, default: "auto" }
concurrency: { group: collector, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: collector
        working-directory: packages/agents
        env:
          META_TOKEN_AROMANTE: ${{ secrets.META_TOKEN_AROMANTE }}
          META_API_VERSION: v23.0
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL_PROD: https://bitacora-aromante.netlify.app
        run: |
          ACC="${{ github.event.inputs.accounts }}"
          ../../node_modules/.bin/tsx src/cli.ts collector --trigger=${{ github.event_name == 'schedule' && 'schedule' || 'manual' }} --days=${{ github.event.inputs.days || '90' }} ${ACC:+--accounts=$ACC}
      - name: analista
        working-directory: packages/agents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ACC="${{ github.event.inputs.accounts }}"
          ../../node_modules/.bin/tsx src/cli.ts analyst --trigger=${{ github.event_name == 'schedule' && 'schedule' || 'manual' }} --weekly=${{ github.event.inputs.weekly || 'auto' }} ${ACC:+--accounts=$ACC}
