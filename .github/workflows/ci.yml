name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Integración SQL en PostgreSQL efímero
        run: pnpm --filter @agentes-meta/db test:integration
      - name: Build de producción de la web
        run: pnpm --filter @agentes-meta/web build
      - name: Compilar laboratorio visual aislado
        run: pnpm --filter @agentes-meta/web visual:build
      - name: Instalar Chromium de pruebas
        run: pnpm --filter @agentes-meta/web exec playwright install --with-deps --only-shell chromium
      - name: Verificar componentes en navegador sin APIs externas
        run: pnpm --filter @agentes-meta/web test:visual
